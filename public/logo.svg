<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Color matching original Blue -->
  <rect width="512" height="512" rx="64" fill="#0047AB" />
  
  <!-- Spade Outer Base Border Stroke -->
  <path d="M 256 70
           C 285 105, 395 220, 395 305
           C 395 375, 340 393, 288 375
           C 272 369, 269 385, 273 420
           C 277 447, 296 454, 312 454
           L 200 454
           C 216 454, 235 447, 239 420
           C 243 385, 240 369, 224 375
           C 172 393, 117 375, 117 305
           C 117 220, 227 105, 256 70 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="18" 
        stroke-linejoin="round" />
        
  <!-- Inner Black Fill Spade Body -->
  <path d="M 256 84
           C 280 119, 381 228, 381 305
           C 381 364, 332 378, 282 362
           C 264 356, 261 372, 265 407
           C 269 432, 284 439, 298 440
           L 214 440
           C 228 439, 243 432, 247 407
           C 251 372, 248 356, 230 362
           C 180 378, 131 364, 131 305
           C 131 228, 232 119, 256 84 Z" 
        fill="#0f1115" 
        stroke="#ffffff"
        stroke-width="4" />

  <!-- White Portfolio / Briefcase inside the spade -->
  <!-- Handle arc -->
  <path d="M 218 200 L 218 180 C 218 168, 228 160, 240 160 L 272 160 C 284 160, 294 168, 294 180 L 294 200" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="14" 
        stroke-linecap="round" />
        
  <!-- Briefcase Main Body outline & black interior -->
  <rect x="156" y="196" width="200" height="135" rx="16" fill="#0f1115" stroke="#ffffff" stroke-width="12" />
  
  <!-- Briefcase Curved Outer Flap stroke -->
  <path d="M 156 196 L 156 260 C 156 260, 210 286, 256 286 C 302 286, 356 260, 356 260 L 356 196" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="8" />

  <!-- Sleek rounded metal center latch button -->
  <rect x="238" y="246" width="36" height="42" rx="8" fill="#ffffff" />
  <!-- Latch dividing line -->
  <line x1="238" y1="267" x2="274" y2="267" stroke="#0f1115" stroke-width="4" />
</svg>
